name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://atlas:atlas@localhost:5433/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run --project unit
      - name: Research validation (files)
        run: pnpm research:validate && pnpm chronology:validate
      - name: Database tests + research import
        run: |
          pnpm db:migrate && pnpm db:seed
          pnpm vitest run --project db
          pnpm research:import
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build site from the validated research export
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: End-to-end, mobile and accessibility tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
